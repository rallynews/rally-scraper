name: Verify Candidate Feeds

# Temporary. Fetches every URL in candidate_sources.json and reports whether it
# actually parses as a feed, so candidates can be judged before they go into the
# source directory. Deleted once the candidates are settled.

on:
  push:
    branches:
      - claude/news-sources-canada-mexico-1cxmru
    paths:
      - candidate_sources.json
      - .github/workflows/verify-candidates.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests --break-system-packages

      - name: Verify candidates
        run: |
          python - <<'PY' 2>&1 | tee candidates.log
          import json
          import source_directory as sd

          raw = json.load(open('candidate_sources.json'))
          cands = [{'source': n, 'feed_url': u}
                   for n, u in raw.items() if not n.startswith('_')]
          print(f"Verifying {len(cands)} candidate feeds…\n")
          sd.report_verification(sd.verify_all(cands, workers=6, timeout=25))
          PY

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Candidate feed verification'
            echo
            echo '```'
            cat candidates.log 2>/dev/null || echo 'No output captured.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
