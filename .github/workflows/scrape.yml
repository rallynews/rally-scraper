name: Run Rally News Scraper

on:
  # Triggered externally every hour by cron-jobs.org via GitHub API
  workflow_dispatch:
    inputs:
      filter_version:
        # Which set of filter rules to judge stories by. Blank — which is what
        # an unattended dispatch sends, since it sends no inputs at all — means
        # the version deployed in Rally Studio, and that is what every scheduled
        # run uses.
        #
        # Naming a version here runs against that one instead, so a draft can be
        # tried on real feeds before anyone deploys it. Such a run publishes what
        # it finds like any other, but it does NOT update filter.lock.json: the
        # lockfile is the fallback every future run reaches for when the API is
        # unreachable, and a draft has no business becoming that.
        description: 'Filter version ID to run against (blank = the deployed one)'
        required: false
        type: string

  # Runs on push to main (for testing)
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml --break-system-packages
      
      - name: Run scraper
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          # Read-only key for the admin-managed source directory
          # (api/sources.php) and the editorial filter (api/filter.php).
          # Deliberately NOT the same value as NEWS_API_KEY: that one can write
          # articles, these can only read configuration.
          SOURCES_API_KEY: ${{ secrets.SOURCES_API_KEY }}
          # Empty on every scheduled run, which is how the scraper knows to ask
          # for the deployed filter version. See the workflow_dispatch input.
          # Read through github.event rather than the inputs context so the same
          # expression is valid on the push trigger, where there are no inputs.
          FILTER_VERSION_ID: ${{ github.event.inputs.filter_version }}
        run: |
          python scraper.py
      
      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
      
      - name: Commit and push changes
        run: |
          # The lockfiles are the scraper's fallback copies of the source list
          # and the deployed editorial filter. Committing them keeps every
          # change an admin makes visible in git history — the audit trail that
          # moving those out of the code would otherwise cost, and, for the
          # filter, a record of which version was live for which runs.
          #
          # A run pointed at an undeployed filter version writes no lockfile at
          # all, so a dry run against a draft leaves nothing here to commit.
          #
          # They are only written once the scraper has successfully read the
          # dashboard, so on a runner that has no SOURCES_API_KEY yet — or any
          # run where the API was unreachable — they simply do not exist. Naming
          # a missing path makes `git add` exit 128 and fails the whole job,
          # AFTER the scrape has already succeeded: articles reach the database
          # but rallyingcries.rss never gets committed. So add only what is
          # actually there.
          for f in rallyingcries.rss fallback_images.json sources.lock.json filter.lock.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "Update scraped data - $(date '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying in $((i * 5))s..."
              sleep $((i * 5))
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
