name: Run Rally News Scraper

on:
  # Triggered externally every hour by cron-jobs.org via GitHub API
  workflow_dispatch:

  # Runs on push to main (for testing)
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml --break-system-packages
      
      - name: Run scraper
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          # Read-only key for the admin-managed source directory
          # (api/sources.php). Deliberately NOT the same value as NEWS_API_KEY:
          # that one can write articles, this one can only read the list.
          SOURCES_API_KEY: ${{ secrets.SOURCES_API_KEY }}
          # 'shadow' (default) fetches the dashboard's source list and reports
          # how it differs from the maps in scraper.py, but scrapes the maps.
          # Set the SOURCE_DIRECTORY_MODE repository variable to 'live' to
          # scrape the dashboard's list instead — no code change needed, and it
          # can be switched back just as quickly.
          SOURCE_DIRECTORY_MODE: ${{ vars.SOURCE_DIRECTORY_MODE || 'shadow' }}
        run: |
          python scraper.py
      
      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
      
      - name: Commit and push changes
        run: |
          # sources.lock.json is the scraper's fallback copy of the source
          # directory. Committing it means every change an admin makes to the
          # list leaves a diff in git history — the audit trail that moving the
          # list out of the code would otherwise cost.
          git add rallyingcries.rss fallback_images.json sources.lock.json
          if ! git diff --staged --quiet; then
            git commit -m "Update scraped data - $(date '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying in $((i * 5))s..."
              sleep $((i * 5))
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
