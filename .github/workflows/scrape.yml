```yaml
name: Scrape Positive News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run scraper
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: python scraper.py
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'Rally Bot'
          git config --global user.email 'bot@rally.com'
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news [$(date)]" && git push)
```
