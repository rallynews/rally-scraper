name: Backfill Rally summaries

# Writes Rally's own summary onto articles scraped before the scraper started
# producing one. Without it, those articles' pages fall back to the publisher's
# blurb — which is the duplicate-of-the-source problem the field exists to fix.
#
# Deliberately manual, and deliberately a form rather than a schedule. Each
# article costs one model call, there are thousands of them, and whether the
# prose is any good is a judgement call somebody has to make by reading it. So:
# run it in dry-run first, read what comes back, then run it for real in
# batches you have decided on.
#
# Everything it needs is already in this repository's secrets, the same three
# the scraper itself runs on.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many articles to write (start with 20)'
        required: true
        default: '20'
        type: string
      dry_run:
        description: 'Dry run — generate and print, write nothing'
        required: true
        default: true
        type: boolean
      since:
        description: 'Only articles from this date onward (YYYY-MM-DD, optional)'
        required: false
        default: ''
        type: string

# One at a time: two runs would generate summaries for the same articles and
# pay for both.
concurrency:
  group: backfill-summaries
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml --break-system-packages

      - name: Backfill
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          args="--limit ${{ inputs.limit }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ -n "${{ inputs.since }}" ]; then
            args="$args --since ${{ inputs.since }}"
          fi
          echo "Running: backfill_rally_summary.py $args"
          echo
          python3 backfill_rally_summary.py $args

      - name: What this did
        if: always()
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry run — nothing was saved" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the **Backfill** step above and read the summaries it produced." >> "$GITHUB_STEP_SUMMARY"
            echo "If they read well, run this again with **Dry run** unticked." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Summaries were saved to the database" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The count is at the end of the **Backfill** step above." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with a larger limit to continue through the archive." >> "$GITHUB_STEP_SUMMARY"
          fi
